<div class="app" id="app">

  <div class="bar" id="bar">

      <button data-speed="2">2×</button>

  </div>

</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const q = new URLSearchParams(location.search);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,s) => a + (b-a)*s;
const smooth = s => { s = clamp(s,0,1); return s*s*(3-2*s); };
const P = 7, K = 4, HOLD = 1.6, T = P*K + HOLD;
const XSTAR = 0.35, BAND = [0.30, 0.42];
const W = 1600, H = 900;
const FOCUS = [478, 404];
const TH0 = Math.atan2(238-FOCUS[1], 690-FOCUS[0]);   // transducer axis (points up-right, back of head)
const HALF = 15*Math.PI/180;
const R_IN = 240, R_OUT = 268;
const PXMM = 10;                                      // on-head exaggeration: px per mm of focus offset

/* ---------- copy ---------- */
const L = {
  en: {
    title: 'Closed-Loop Ultrasound Neuromodulation',
    sub: 'Low-intensity focused ultrasound: dose and focus set by real-time EEG',
    pills: ['Sense','Decode','Control','Stimulate','Respond'],
    cap: {
      sense: 'Scalp EEG streams in real time',
      decode: 'A decoder estimates the brain state from EEG',
      control: 'Compare with the target state, set the ultrasound dose',
      stim: 'Focused ultrasound reaches the deep target through the skull',
      respond: 'The brain state shifts; the next cycle re-measures',
      hold: 'Within the target band — the dose falls to maintenance',
    },
    capOpen: {
      sense: 'Open loop: no measurement, no feedback',
      decode: 'Open loop: no measurement, no feedback',
      control: 'The same dose at the MRI target, every cycle',
      stim: 'Focused ultrasound reaches the deep target through the skull',
      respond: 'The brain state changes, but nothing checks it',
      hold: 'No feedback: focus off-target, the state never reaches the band',
    },
    c1: ['Sense','Scalp EEG · streaming'], c2: ['Decode','Brain-state estimate'], c3: ['Control','Dose & focus'],
    notUsed: 'NOT USED',
    capControl: ['Set the dose; pre-shift the focus for skull refraction', 'Weak response for the dose: steer the focus, re-dose', 'Better response: step the focus further, lower the dose', 'Focus locked; the dose tapers as the state nears target'],
    focus: 'Focus offset', focusFrom: 'from MRI target', focusLbl: 'focus',
    eeg: 'EEG', tfus: ['tFUS transducer','500 kHz'], mriT: ['MRI target','(thalamus)'], inBand: 'In band', offTarget: 'Off target',
    electrodes: 'EEG electrodes', transducer: ['Focused ultrasound', 'transducer · 500 kHz'],
    target: 'Deep target (thalamus)', mri: 'MRI-guided',
    xhat: 'x̂', tgt: 'target x* = 0.35', band: 'target band',
    formula: 'u = K · (x̂ − x*)', formulaOpen: 'u = fixed', err: 'x̂ − x*',
    intensity: 'Intensity I', unit: 'W/cm²', prf: 'PRF 500 Hz', duty: 'Duty 30 %', burst: 'Burst 500 ms',
    chart: 'Brain state across cycles', legState: 'brain state', legDose: 'ultrasound dose', legBand: 'target band',
    cycle: k => `cycle ${k}`, high: 'too high', inband: 'in target band', over: 'overshoot', wait: '—',
  },
  zh: {
    title: '闭环超声神经调控',
    sub: '低强度聚焦超声：剂量与焦点由实时 EEG 决定',
    pills: ['采集','解码','决策','刺激','响应'],
    cap: {
      sense: '头皮 EEG 实时采集',
      decode: '解码器从 EEG 估计当前脑状态',
      control: '与目标状态比较，计算超声剂量',
      stim: '聚焦超声透过颅骨作用于深部靶点',
      respond: '脑状态改变，下一轮重新测量',
      hold: '进入目标区间 — 剂量降至维持水平',
    },
    capOpen: {
      sense: '开环：不测量，无反馈',
      decode: '开环：不测量，无反馈',
      control: '每一轮都在 MRI 靶点给同样的剂量',
      stim: '聚焦超声透过颅骨作用于深部靶点',
      respond: '脑状态改变，但没有任何环节检查它',
      hold: '无反馈：焦点偏离有效位点，脑状态达不到目标区间',
    },
    c1: ['采集','头皮 EEG · 实时流'], c2: ['解码','脑状态估计'], c3: ['决策','剂量与焦点'],
    notUsed: '未使用',
    capControl: ['计算剂量；按颅骨折射预先校正焦点', '响应弱于预期：调整焦点位置，重新给剂量', '响应改善：焦点再进一步，剂量下调', '焦点锁定；状态接近目标，剂量递减'],
    focus: '焦点偏移', focusFrom: '相对 MRI 靶点', focusLbl: '焦点',
    eeg: 'EEG', tfus: ['超声换能器','500 kHz'], mriT: ['MRI 靶点','（丘脑）'], inBand: '达标', offTarget: '未达标',
    electrodes: 'EEG 电极', transducer: ['聚焦超声换能器', '500 kHz'],
    target: '深部靶点（丘脑）', mri: 'MRI 导航',
    xhat: 'x̂', tgt: '目标 x* = 0.35', band: '目标区间',
    formula: 'u = K · (x̂ − x*)', formulaOpen: 'u = 固定', err: 'x̂ − x*',
    intensity: '强度 I', unit: 'W/cm²', prf: 'PRF 500 Hz', duty: '占空比 30 %', burst: '脉冲串 500 ms',
    chart: '脑状态随周期变化', legState: '脑状态', legDose: '超声剂量', legBand: '目标区间',
    cycle: k => `第 ${k} 轮`, high: '偏高', inband: '进入目标区间', over: '越过目标', wait: '—',
  }
};

/* ---------- model ---------- */
const OFFS = [[2,-1],[4,-2],[6,-3],[6,-3]];  // focus offset per cycle, mm (+x posterior, +y inferior on screen)
const SITE = [6,-3], SIG2 = 12.04;           // effective site; efficacy 0.44 after the skull pre-shift, 0.15 at the MRI target itself
const eff = o => Math.exp(-((o[0]-SITE[0])**2 + (o[1]-SITE[1])**2)/(2*SIG2));
function schedule(mode){
  const xs = [0.85], us = [], offs = [], etas = [];
  for (let k=0;k<K;k++){
    const x = xs[k], off = mode==='closed' ? OFFS[k] : [0,0], eta = eff(off);
    const u = mode==='closed' ? clamp(1.8*(x-XSTAR), 0, 1) : 0.9;
    us.push(u); offs.push(off); etas.push(eta); xs.push(clamp(x - 0.34*u*eta, 0.04, 1));
  }
  return {xs, us, offs, etas};
}
function offAt(k, tau, sch){
  if (k >= K) return sch.offs[K-1];
  const prev = k>0 ? sch.offs[k-1] : [0,0];
  if (tau < 3.3) return prev;
  const s = smooth((tau-3.3)/0.7);
  return [lerp(prev[0], sch.offs[k][0], s), lerp(prev[1], sch.offs[k][1], s)];
}
function stateAt(t, sch){
  const k = clamp(Math.floor(t/P), 0, K);
  let x;
  if (k >= K) x = sch.xs[K];
  else { const tau = t - k*P; x = lerp(sch.xs[k], sch.xs[k+1], smooth((tau-6.0)/0.9)); }
  return clamp(x + 0.012*Math.sin(3.7*t) + 0.008*Math.sin(9.1*t+1), 0, 1);
}
function phaseAt(t){
  if (t >= K*P) return {k:K, tau:t-K*P, name:'hold'};
  const k = Math.floor(t/P), tau = t-k*P;
  const name = tau<1.6?'sense' : tau<2.8?'decode' : tau<4.0?'control' : tau<6.0?'stim' : 'respond';
  return {k, tau, name};
}
function estimateAt(k, tau, sch){          // what the decoder currently displays (null = nothing yet)
  if (k >= K) return lerp(sch.xs[K-1], sch.xs[K], smooth(tau/0.6));
  const prev = k>0 ? sch.xs[k-1] : null;
  if (tau < 2.2) return prev;
  return lerp(prev===null ? 0 : prev, sch.xs[k], smooth((tau-2.2)/0.5));
}
function doseAt(k, tau, sch, mode){
  if (k >= K) return mode==='closed' ? 0.04 : 0.9;
  const prev = k>0 ? sch.us[k-1] : (mode==='closed' ? 0 : 0.9);
  if (tau < 3.3) return prev;
  return lerp(prev, sch.us[k], smooth((tau-3.3)/0.5));
}
function eeg(ch, tt, x){
  const ph = [0, 2.1, 4.2][ch];
  const bg = 5*Math.sin(2*Math.PI*0.7*tt+ph) + 3*Math.sin(2*Math.PI*1.9*tt+ph*1.7) + 2*Math.sin(2*Math.PI*4.3*tt+ph*0.4) + 1.2*Math.sin(2*Math.PI*11*tt+ph);
  const rhythm = 17*x*Math.sin(2*Math.PI*5*tt + ph*0.6) * (0.75 + 0.25*Math.sin(2*Math.PI*0.45*tt+ph));
  return bg + rhythm;
}

/* ---------- geometry helpers ---------- */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs){ if (attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, cls, attrs){
  const t = el('text', Object.assign({x, y, class: cls}, attrs||{}), parent);
  t.textContent = s; return t;
}
function spline(pts, closed){
  const n = pts.length, get = i => closed ? pts[(i+n)%n] : pts[clamp(i,0,n-1)];
  let d = `M${pts[0][0]},${pts[0][1]}`;
  const m = closed ? n : n-1;
  for (let i=0;i<m;i++){
    const p0=get(i-1), p1=get(i), p2=get(i+1), p3=get(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];

/* ---------- render ---------- */
function render(R, t, mode, lang){
  const S = L[lang], sch = schedule(mode);
  const closed = mode==='closed';
  const {k, tau, name} = phaseAt(t);
  const x = stateAt(t, sch);
  const xhat = estimateAt(k, tau, sch);
  const u = doseAt(k, tau, sch, mode);
  const uk = k<K ? sch.us[k] : (closed ? 0.04 : 0.9);
  const off = offAt(k, tau, sch);
  const foc = [FOCUS[0]+PXMM*off[0], FOCUS[1]+PXMM*off[1]];
  const on = c => c.classList;

  /* text */
  R.title.textContent = S.title; R.sub.textContent = S.sub;
  const capSet = closed ? S.cap : S.capOpen;
  R.caption.textContent = (closed && name==='control') ? S.capControl[Math.min(k, S.capControl.length-1)] : capSet[name];
  const order = ['sense','decode','control','stim','respond'];
  R.pills.forEach((p,i) => {
    const active = order[i]===name || (name==='hold' && (i===1 || i===0));
    p.classList.toggle('on', active && (closed || i>=2));
    p.classList.toggle('off', !closed && i<2);
    R.pillT[i].textContent = S.pills[i]; R.pillT[i].classList.toggle('on', active && (closed || i>=2));
  });
  [[R.c1,S.c1],[R.c2,S.c2],[R.c3,S.c3]].forEach(([c,s]) => { c.h1.textContent = s[0]; c.h2.textContent = s[1]; });
  R.c1.rect.classList.toggle('on', closed && (name==='sense' || name==='hold'));
  R.c2.rect.classList.toggle('on', closed && (name==='decode' || name==='hold'));
  R.c3.rect.classList.toggle('on', name==='control');
  R.c1.g.classList.toggle('dim', !closed); R.c2.g.classList.toggle('dim', !closed);
  [R.c1, R.c2].forEach(c => { c.nu.textContent = S.notUsed; if (closed) { c.nu.setAttribute('hidden',''); c.h2.removeAttribute('hidden'); } else { c.nu.removeAttribute('hidden'); c.h2.setAttribute('hidden',''); } });
  R.wireA.classList.toggle('off', !closed); R.arrow12.classList.toggle('off', !closed); R.arrow23.classList.toggle('off', !closed);
  const arrOff = `url(#arr-off-${R.uid})`, arrOn = `url(#arr-${R.uid})`;
  [R.wireA, R.arrow12, R.arrow23].forEach(w => w.setAttribute('marker-end', closed ? arrOn : arrOff));
  R.elecT.textContent = S.electrodes; R.transT1.textContent = S.transducer[0]; R.transT2.textContent = S.transducer[1];
  R.targetT.textContent = S.target; R.mriT.textContent = S.mri; R.tgtT.textContent = S.tgt;
  R.formulaT.textContent = closed ? S.formula : S.formulaOpen;
  R.chips[0].textContent = S.prf; R.chips[1].textContent = S.duty; R.chips[2].textContent = S.burst;
  R.chartT.textContent = S.chart; R.legState.textContent = S.legState; R.legDose.textContent = S.legDose; R.legBand.textContent = S.legBand;
  R.cycleT.forEach((c,i) => c.textContent = S.cycle(i+1));
  if (!R.intT.firstChild || R.intT.dataset.lang !== lang){
    R.intT.textContent = ''; R.intT.dataset.lang = lang;
    R.intT.appendChild(document.createTextNode(S.intensity));
    const sub = el('tspan', {dy:'4', 'font-size':'10px'}, R.intT); sub.textContent = 'SPPA';
  }

  /* electrodes + EEG */
  const sensing = closed && (name==='sense' || name==='hold');
  const flash = name==='respond' && tau>6.55 && tau<6.9;
  R.elecs.forEach((e,i) => e.classList.toggle('hot', (sensing && Math.sin(t*9+i)>0) || flash));
  const N = 160, WIN = 3;
  R.eeg.forEach((pl,ch) => {
    let pts = '';
    for (let i=0;i<=N;i++){
      const tt = t - WIN + WIN*i/N;
      const xx = 968 + (1516-968)*i/N;
      const v = closed || true ? eeg(ch, tt, stateAt(tt, sch)) : 0;
      pts += `${xx.toFixed(1)},${(R.eegY[ch]-v).toFixed(1)} `;
    }
    pl.setAttribute('points', pts);
  });

  /* decoder */
  R.nn.forEach((layer,l) => layer.forEach((n,i) => n.classList.toggle('hot', closed && ((name==='decode' && tau>2.0+0.18*l && tau<2.75) || (name==='hold' && tau<0.7 && tau>0.15*l)))));
  const showEst = closed && xhat!==null;
  R.marker.setAttribute('cx', R.bx(showEst ? xhat : 0));
  R.marker.style.opacity = showEst ? 1 : 0;
  R.xhatT.textContent = showEst ? `${S.xhat} = ${xhat.toFixed(2)}` : `${S.xhat} = ${S.wait}`;
  const settled = closed && xhat!==null && ((k<K && (tau>=2.75 || (k>0 && tau<2.2))) || (k>=K && tau>0.6));
  let status = null;
  if (settled){ status = xhat > BAND[1] ? 'bad-high' : xhat < BAND[0] ? 'bad-low' : 'good'; }
  R.marker.classList.toggle('bad', status && status!=='good'); R.marker.classList.toggle('good', status==='good');
  if (status){
    const label = status==='good' ? S.inband : status==='bad-high' ? S.high : S.over;
    const bw = lang==='zh' ? label.length*13+22 : label.length*7.2+22;
    const bxc = clamp(R.bx(xhat), 1110+bw/2, 1450-bw/2);
    R.badge.setAttribute('x', bxc-bw/2); R.badge.setAttribute('width', bw);
    R.badge.setAttribute('class', `badge ${status==='good'?'good':'bad'}`);
    R.badgeT.setAttribute('x', bxc); R.badgeT.textContent = label;
    R.badge.style.opacity = 1; R.badgeT.style.opacity = 1;
  } else { R.badge.style.opacity = 0; R.badgeT.style.opacity = 0; }

  /* controller */
  const errKnown = closed && status!==null;
  R.errT.textContent = errKnown ? `${S.err} = ${(xhat-XSTAR)>=0?'+':'−'}${Math.abs(xhat-XSTAR).toFixed(2)}` : '';
  R.knob.setAttribute('cx', R.sx(u)); R.sfill.setAttribute('width', R.sx(u)-R.sx(0));
  R.doseT.textContent = `${(10*u).toFixed(1)} ${S.unit}`;
  /* on-head focus marker, aim line, steering arrow */
  R.aim.setAttribute('x2', foc[0]); R.aim.setAttribute('y2', foc[1]);
  R.focMark.setAttribute('cx', foc[0]); R.focMark.setAttribute('cy', foc[1]);

    c.setAttribute('cx', foc[0]); c.setAttribute('cy', foc[1]);
    if (name!=='respond' || s<0 || s>1){ c.style.opacity = 0; return; }
    c.setAttribute('r', 20+250*s); c.style.opacity = (1-s)*0.8*(0.3+0.7*intensity); c.setAttribute('stroke-width', (4-3*s).toFixed(1));
  });

  /* nodes */
  const active = {sense: closed && (name==='sense' || name==='hold'), decode: closed && (name==='decode' || name==='hold'), control: name==='control', stim: name==='stim'};
  for (const key of ['sense','decode','control','stim']){
    const n = R.node[key];
    n.g.classList.toggle('on', !!active[key]);
    n.g.classList.toggle('dim', !closed && (key==='sense' || key==='decode'));
    n.t.textContent = S.pills[order.indexOf(key)];
    n.nu.textContent = S.notUsed;
    if (!closed && (key==='sense' || key==='decode')) n.nu.removeAttribute('hidden'); else n.nu.setAttribute('hidden','');
  }
  const sN = R.node.sense; let pts = '';
  for (let i=0;i<=120;i++){ const tt = t-3+3*i/120, xx = sN.x+24+252*i/120; pts += `${xx.toFixed(1)},${(sN.y+96-0.9*eeg(1, tt, stateAt(tt, sch))).toFixed(1)} `; }
  R.sEeg.setAttribute('points', pts);
  const showEst = closed && xhat!==null;
  R.sMarker.style.opacity = showEst ? 1 : 0; R.sMarker.setAttribute('cx', R.sbx(showEst ? xhat : 0));
  const settled = closed && xhat!==null && ((k<K && (tau>=2.75 || (k>0 && tau<2.2))) || (k>=K && tau>0.6));
  const status = settled ? (xhat > BAND[1] ? 'bad' : xhat < BAND[0] ? 'bad' : 'good') : null;
  R.sMarker.classList.toggle('bad', status==='bad'); R.sMarker.classList.toggle('good', status==='good');
  R.sXhat.textContent = showEst ? xhat.toFixed(2) : S.wait;
  R.sDose.textContent = `${(10*u).toFixed(1)} ${S.unit}`;
  R.sFoc.textContent = `Δ ${Math.hypot(off[0], off[1]).toFixed(1)} mm`;
  R.sPrf.textContent = S.prf;
  R.sPulses.forEach((p,i) => {
    const c = R.pulseC;
    let r, op;
    if (firing){ const f = ((tau-4.4)*2.2 + i/4) % 1; r = 96*(1-f)+6; op = 0.35+0.65*f; }
    else { r = 24+24*i; op = 0.35; }
    const a0 = -0.62, a1 = 0.62;
    p.setAttribute('d', `M${(c[0]+r*Math.cos(a0)).toFixed(1)},${(c[1]+r*Math.sin(a0)).toFixed(1)} A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${(c[0]+r*Math.cos(a1)).toFixed(1)},${(c[1]+r*Math.sin(a1)).toFixed(1)}`);
    p.style.opacity = op;
  });

  /* arrows + packets */
  [R.arrAB, R.arrBC].forEach(a => a.classList.toggle('off', !closed));
  const along = (elm, path, s) => { if (s===null){ elm.style.opacity = 0; return; } const len = path.getTotalLength(), p = path.getPointAtLength(len*clamp(s,0,1)); elm.setAttribute('cx', p.x); elm.setAttribute('cy', p.y); elm.style.opacity = 1; };
  along(R.pA, R.wireA, closed && name==='sense' && tau>0.3 && tau<1.1 ? (tau-0.3)/0.8 : null);
  along(R.pB, R.arrAB, closed && name==='decode' && tau<2.0 ? (tau-1.6)/0.4 : null);
  along(R.pC, R.arrBC, closed && name==='control' && tau<3.2 ? (tau-2.8)/0.4 : null);
  if (name==='stim' && tau<4.45) along(R.pD, tau<4.2 ? R.arrCD : R.cable, tau<4.2 ? (tau-4.0)/0.2 : (tau-4.2)/0.25); else R.pD.style.opacity = 0;

  /* chart */
  R.cycleT.forEach((c,i) => c.textContent = S.cycle(i+1));
  R.legState.textContent = S.legState; R.legDose.textContent = S.legDose; R.legBand.textContent = S.legBand;
  let cp = '';
  for (let tt=0; tt<=t; tt+=0.08) cp += `${R.cx(tt).toFixed(1)},${R.cy(stateAt(tt,sch)).toFixed(1)} `;
  cp += `${R.cx(t).toFixed(1)},${R.cy(x).toFixed(1)}`;
  R.line.setAttribute('points', cp);
  R.dot.setAttribute('cx', R.cx(t)); R.dot.setAttribute('cy', R.cy(x));
  R.doses.forEach((d,kk) => {
    const t0 = kk*P+4.5, t1 = kk*P+5.8;
    if (t < t0){ d.setAttribute('width', 0); return; }
    const hgt = 120*sch.us[kk];
    d.setAttribute('x', R.cx(t0)); d.setAttribute('width', Math.max(1, R.cx(Math.min(t,t1))-R.cx(t0)));
    d.setAttribute('y', 850-hgt); d.setAttribute('height', hgt);
  });
}

/* ---------- app ---------- */
const stored = k => { try { return localStorage.getItem('cltus-'+k); } catch(e){ return null; } };
const store = (k,v) => { try { localStorage.setItem('cltus-'+k, v); } catch(e){} };
const state = {
  t: Math.max(0, parseFloat(q.get('t')||'0')||0) % T,
  playing: q.get('paused')!=='1',
  speed: parseFloat(q.get('speed')||'1')||1,
  lang: ['en','zh'].includes(q.get('lang')) ? q.get('lang') : (['en','zh'].includes(stored('lang')) ? stored('lang') : 'en'),
  mode: ['closed','open'].includes(q.get('mode')) ? q.get('mode') : (['closed','open'].includes(stored('mode')) ? stored('mode') : 'closed'),
  layout: q.get('layout')==='slide' ? 'slide' : (q.get('layout')==='full' ? 'full' : (stored('layout')==='slide' ? 'slide' : 'full')),
};
const app = document.getElementById('app'), wrap = document.getElementById('stageWrap');
if (q.get('theme')==='light' || q.get('theme')==='dark') document.documentElement.setAttribute('data-theme', q.get('theme'));
const sheetN = parseInt(q.get('sheet')||'0', 10);

if (sheetN > 0){
  /* frame-sheet mode for offline export: N stages stacked, each at t0 + i*dt */
  document.body.classList.add('sheet');
  document.getElementById('bar').hidden = true; document.getElementById('hint').hidden = true;
  const dt = parseFloat(q.get('dt')||'0.0416667'), w = parseInt(q.get('w')||'1600',10), h = Math.round(w*H/W);
  for (let i=0;i<sheetN;i++){
    const d = document.createElement('div'); d.style.width = w+'px'; d.style.height = h+'px'; wrap.appendChild(d);
    const R = state.layout==='slide' ? buildSlide(d, i) : buildStage(d, i);
    (state.layout==='slide' ? renderSlide : render)(R, (state.t + i*dt) % T, state.mode, state.lang);
  }
} else {
  let R = state.layout==='slide' ? buildSlide(wrap, 0) : buildStage(wrap, 0);
  const rebuild = () => { wrap.innerHTML = ''; R = state.layout==='slide' ? buildSlide(wrap, 0) : buildStage(wrap, 0); };
  const draw = () => (state.layout==='slide' ? renderSlide : render)(R, state.t, state.mode, state.lang);
  if (q.get('hide')==='1'){ document.getElementById('bar').hidden = true; document.getElementById('hint').hidden = true; }
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced && !q.has('t')){ state.playing = false; state.t = 4.9; }

  const btnPlay = document.getElementById('btnPlay');
  const syncUI = () => {
    btnPlay.textContent = state.playing ? (state.lang==='zh' ? '暂停' : 'Pause') : (state.lang==='zh' ? '播放' : 'Play');
    document.getElementById('btnRestart').textContent = state.lang==='zh' ? '重播' : 'Restart';
    document.getElementById('btnPrev').textContent = state.lang==='zh' ? '◀ 上一步' : '◀ Step';
    document.getElementById('btnNext').textContent = state.lang==='zh' ? '下一步 ▶' : 'Step ▶';
    document.getElementById('btnFs').textContent = state.lang==='zh' ? '全屏' : 'Fullscreen';
    document.querySelectorAll('#grpMode button').forEach(b => { b.classList.toggle('on', b.dataset.mode===state.mode); b.textContent = state.lang==='zh' ? (b.dataset.mode==='closed'?'闭环':'开环') : (b.dataset.mode==='closed'?'Closed loop':'Open loop'); });
    document.querySelectorAll('#grpLang button').forEach(b => b.classList.toggle('on', b.dataset.lang===state.lang));
    document.querySelectorAll('#grpLayout button').forEach(b => { b.classList.toggle('on', b.dataset.layout===state.layout); b.textContent = state.lang==='zh' ? (b.dataset.layout==='slide'?'紧凑':'完整') : (b.dataset.layout==='slide'?'Compact':'Full'); });
    document.querySelectorAll('#grpSpeed button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.speed)===state.speed));
    document.getElementById('hint').textContent = state.lang==='zh' ? '空格 播放/暂停 · ←/→ 单步 · M 模式 · L 语言 · C 布局 · F 全屏' : 'Space play/pause · ←/→ step · M mode · L language · C layout · F fullscreen';
  };
  const bounds = [];
  for (let k=0;k<K;k++) for (const o of [0,1.6,2.8,4.0,6.0]) bounds.push(k*P+o);
  bounds.push(K*P);
  const step = dir => {
    state.playing = false;
    if (dir>0){ const nb = bounds.find(b => b > state.t+0.02); state.t = nb===undefined ? 0 : nb; }
    else { const pb = [...bounds].reverse().find(b => b < state.t-0.02); state.t = pb===undefined ? bounds[bounds.length-1] : pb; }
    syncUI(); draw();
  };
  btnPlay.onclick = () => { state.playing = !state.playing; syncUI(); };
  document.getElementById('btnRestart').onclick = () => { state.t = 0; state.playing = true; syncUI(); };
  document.getElementById('btnPrev').onclick = () => step(-1);
  document.getElementById('btnNext').onclick = () => step(1);
  document.querySelectorAll('#grpMode button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; store('mode', state.mode); syncUI(); draw(); });
  document.querySelectorAll('#grpLang button').forEach(b => b.onclick = () => { state.lang = b.dataset.lang; store('lang', state.lang); syncUI(); draw(); });
  document.querySelectorAll('#grpSpeed button').forEach(b => b.onclick = () => { state.speed = parseFloat(b.dataset.speed); syncUI(); });
  document.querySelectorAll('#grpLayout button').forEach(b => b.onclick = () => { state.layout = b.dataset.layout; store('layout', state.layout); rebuild(); syncUI(); draw(); });
  const fsBtn = document.getElementById('btnFs');
  fsBtn.onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (app.requestFullscreen) app.requestFullscreen(); };
  let idleTimer = null;
  const poke = () => { app.classList.remove('idle'); clearTimeout(idleTimer); if (document.fullscreenElement) idleTimer = setTimeout(() => app.classList.add('idle'), 2200); };
  document.addEventListener('fullscreenchange', () => { app.classList.toggle('fs', !!document.fullscreenElement); poke(); });
  document.addEventListener('mousemove', poke);
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code==='Space'){ e.preventDefault(); btnPlay.onclick(); }
    else if (e.key==='ArrowRight') step(1);
    else if (e.key==='ArrowLeft') step(-1);
    else if (e.key==='r' || e.key==='R') document.getElementById('btnRestart').onclick();
    else if (e.key==='m' || e.key==='M'){ state.mode = state.mode==='closed' ? 'open' : 'closed'; store('mode', state.mode); syncUI(); draw(); }
    else if (e.key==='l' || e.key==='L'){ state.lang = state.lang==='en' ? 'zh' : 'en'; store('lang', state.lang); syncUI(); draw(); }
    else if (e.key==='f' || e.key==='F') fsBtn.onclick();
    else if (e.key==='c' || e.key==='C'){ state.layout = state.layout==='slide' ? 'full' : 'slide'; store('layout', state.layout); rebuild(); syncUI(); draw(); }
    poke();
  });

  syncUI();
  let last = null;
  const tick = now => {
    if (last===null) last = now;
    const dt = Math.min(0.1, (now-last)/1000); last = now;
    if (state.playing){ state.t = (state.t + dt*state.speed) % T; }
    draw();
    requestAnimationFrame(tick);
  };
  draw();
  requestAnimationFrame(tick);
}
})();
</script>
</body></html>
